name: Weekly Container Rebuild

# Re-publish the "latest" image whenever main changes (including the weekly
# digest bump that docker-digest-bump.yml opens and you merge). This is what
# delivers upstream base-image updates, notably Node, to consumers of
# ghcr.io/BladeWDR/antennapodder:latest without any manual step.
#
# Why only "push" (not "pull_request"): the base image is digest-pinned, so a
# rebuild only matters when the digest on main actually changes; and the
# pull_request event runs with a read-only token that cannot push to GHCR.

on:
  push:
    branches: [main]
    # Only re-publish when the Docker image inputs change. The digest bump lands
    # on main as a Dockerfile change, which is exactly what we want to catch.
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - 'entrypoint.sh'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Rebuild and push "latest"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # "latest" is re-published here. The semantic tags (vX.Y.Z, vX.Y) are
          # the version-tag flow's, and the single highest version tag is
          # re-anchored by the latest-release job below.
          tags: latest

      - name: Build and push "latest"
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Base image is digest-pinned, so the GHA layer cache is safe and keeps
          # the weekly rebuild cheap.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  #
  # Re-anchor the highest version tag (e.g. v0.1.9) to the new digest. The tag
  # itself is created by docker-publish.yml, but its digest drifts when the base
  # image changes, so moving it here is the same "rolling latest" concern — it
  # points the existing highest tag at the new digest, it does not mint a new
  # version.
  #
  # Scope note: this re-tags only the single highest version. It does not also
  # move vX.Y (the "latest vMAJOR.MINOR" convenience tag) — that would need a
  # second lookup and is not part of the request.
  latest-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find highest version tag
        id: latest
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          # Repository tags are all v[0-9].x, so version sort picks the highest.
          LATEST_TAG=$(git tag --list 'v*' | sort -V | tail -1)
          echo "Highest version tag: ${LATEST_TAG:-<none>}"
          echo "tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag highest version
        # If the repo has no version tag yet, skip rather than push an empty tag.
        if: ${{ steps.latest.outputs.tag != '' }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}"
          latest_tag="${{ steps.latest.outputs.tag }}"
          echo "Re-tagging ${image}:${latest_tag} from ${image}:latest"
          docker manifest create --amend "${image}:${latest_tag}" "${image}:latest"
          docker manifest push "${image}:${latest_tag}"
